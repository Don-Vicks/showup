[package]
name = "showup"
version = "0.1.0"
edition = "2021"
description = "ShowUp: RSVP deposits, verified check-ins and per-attendee sponsorship on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-workspaces = { version = "0.23", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
bs58 = "0.5"
